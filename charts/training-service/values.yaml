replicaCount: 1

image:
  repository: quay.io/opendatahub/training-service
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # TokenReview requires the pod to authenticate as its service account.
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Authenticate callers and authorize project-scoped operations through Kubernetes
# TokenReview and SubjectAccessReview APIs. The service account can create only
# these review requests; it does not receive workload permissions.
authentication:
  tokenReview:
    enabled: true

# Additional process environment. The managed catalog sets its own three
# variables when algorithmCatalog.create is true.
env: []
envFrom: []

# Opt-in, image-bound algorithm catalog. Supply json with --set-file and list
# the caller groups/users allowed to read this non-secret ConfigMap.
algorithmCatalog:
  create: false
  name: training-algorithm-catalog
  json: ""
  readerSubjects: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

route:
  enabled: false
  annotations: {}
  host: ""
  path: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
