{{- if .Values.queueDiscovery.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "training-service.fullname" . }}-queue-discovery
  labels:
    {{- include "training-service.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "training-service.fullname" . }}-queue-discovery
  labels:
    {{- include "training-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "training-service.fullname" . }}-queue-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "training-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
