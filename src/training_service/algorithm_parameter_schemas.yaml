# Validation catalog for the currently supported Training Hub backends.
# Kept outside OpenAPI so future discovery can replace this source.
sft:
  type: object
  additionalProperties: false
  properties:
    learning_rate: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1}
    num_epochs: {type: integer, minimum: 1}
    effective_batch_size: {type: integer, minimum: 1}
    max_seq_len: {type: integer, minimum: 1}
    max_tokens_per_gpu: {type: integer, minimum: 1}
    save_samples: {type: integer, minimum: 0}
    warmup_steps: {type: integer, minimum: 0}
    checkpoint_at_epoch: {type: boolean}
    accelerate_full_state_at_epoch: {type: boolean}
    is_pretraining: {type: boolean}
    block_size: {type: integer, minimum: 1}
    document_column_name: {type: string, minLength: 1}
    beta1: {type: number, minimum: 0, maximum: 1, exclusiveMaximum: true}
    beta2: {type: number, minimum: 0, maximum: 1, exclusiveMaximum: true}
    eps: {type: number, minimum: 0, exclusiveMinimum: true}
    weight_decay: {type: number, minimum: 0}
osft:
  type: object
  additionalProperties: false
  required:
    - unfreeze_rank_ratio
    - effective_batch_size
    - max_tokens_per_gpu
    - max_seq_len
    - learning_rate
  properties:
    unfreeze_rank_ratio: {type: number, minimum: 0, maximum: 1}
    effective_batch_size: {type: integer, minimum: 1}
    max_tokens_per_gpu: {type: integer, minimum: 1}
    max_seq_len: {type: integer, minimum: 1}
    learning_rate: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1}
    num_epochs: {type: integer, minimum: 1}
    target_patterns:
      type: array
      minItems: 1
      items: {type: string, minLength: 1}
    seed: {type: integer, minimum: 0}
    use_liger: {type: boolean}
    use_processed_dataset: {type: boolean}
    unmask_messages: {type: boolean}
    lr_scheduler: {type: string, minLength: 1}
    warmup_steps: {type: integer, minimum: 0}
    lr_scheduler_kwargs:
      type: object
      additionalProperties: {type: string}
    checkpoint_at_epoch: {type: boolean}
    save_final_checkpoint: {type: boolean}
    is_pretraining: {type: boolean}
    block_size: {type: integer, minimum: 1}
    document_column_name: {type: string, minLength: 1}
    beta1: {type: number, minimum: 0, maximum: 1, exclusiveMaximum: true}
    beta2: {type: number, minimum: 0, maximum: 1, exclusiveMaximum: true}
    eps: {type: number, minimum: 0, exclusiveMinimum: true}
    weight_decay: {type: number, minimum: 0}
lora_sft:
  type: object
  additionalProperties: false
  properties:
    learning_rate: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1}
    num_epochs: {type: integer, minimum: 1}
    effective_batch_size: {type: integer, minimum: 1}
    max_seq_len: {type: integer, minimum: 1}
    lora_r: {type: integer, minimum: 1}
    lora_alpha: {type: integer, minimum: 1}
    seed: {type: integer, minimum: 0}
    use_rslora: {type: boolean}
    weight_decay: {type: number, minimum: 0}
    lora_dropout: {type: number, minimum: 0, maximum: 1}
    target_modules:
      type: array
      minItems: 1
      items: {type: string, minLength: 1}
    micro_batch_size: {type: integer, minimum: 1}
    gradient_accumulation_steps: {type: integer, minimum: 1}
    lr_scheduler: {type: string, minLength: 1}
    warmup_steps: {type: integer, minimum: 0}
    max_grad_norm: {type: number, minimum: 0, exclusiveMinimum: true}
    load_in_4bit: {type: boolean}
    load_in_8bit: {type: boolean}
    bnb_4bit_quant_type: {type: string, enum: [nf4, fp4]}
    bnb_4bit_compute_dtype: {type: string, enum: [float16, bfloat16, float32]}
    bnb_4bit_use_double_quant: {type: boolean}
    sample_packing: {type: boolean}
    bf16: {type: boolean}
    fp16: {type: boolean}
    save_steps: {type: integer, minimum: 1}
    logging_steps: {type: integer, minimum: 1}
    save_total_limit: {type: integer, minimum: 1}
    dataset_type: {type: string, enum: [chat_template, alpaca, passthrough]}
    field_messages: {type: string, minLength: 1}
    field_instruction: {type: string, minLength: 1}
    field_input: {type: string, minLength: 1}
    field_output: {type: string, minLength: 1}
    enable_model_splitting: {type: boolean}
    finetune_vision_layers: {type: boolean}
    finetune_language_layers: {type: boolean}
lora_grpo:
  type: object
  additionalProperties: false
  properties:
    data_config: {type: string, minLength: 1}
    n_train: {type: integer, minimum: 1}
    n_val: {type: integer, minimum: 0}
    num_iterations: {type: integer, minimum: 1}
    group_size: {type: integer, minimum: 1}
    prompt_batch_size: {type: integer, minimum: 1}
    learning_rate: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1}
    max_tokens: {type: integer, minimum: 1}
    max_prompt_length: {type: integer, minimum: 1}
    lora_r: {type: integer, minimum: 1}
    lora_alpha: {type: integer, minimum: 1}
    gpu_memory_utilization: {type: number, minimum: 0, exclusiveMinimum: true, maximum: 1, exclusiveMaximum: true}
    tensor_parallel_size: {type: integer, minimum: 1}
    use_dr_grpo: {type: boolean}
    reward_type: {type: string, enum: [tool_call, math]}
    saves_per_epoch: {type: integer, minimum: 1}
    param_offload: {type: boolean}
    optimizer_offload: {type: boolean}
    layered_summon: {type: boolean}
    language_model_only: {type: boolean}
